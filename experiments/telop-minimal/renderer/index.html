<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Telop Minimal (drawtext box)</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; script-src 'self';" />
  <style>
    body { margin: 0; background: #0e1117; color: #e6e6e6; font: 14px/1.4 system-ui; }
    .wrap { display:flex; gap:24px; padding:16px; }
    .panel { width: 420px; }
    .preview { flex:1; display:flex; justify-content:center; align-items:center; }
    input, button { width: 100%; padding:8px; background:#1a1f2a; color:#fff; border:1px solid #2b3243; border-radius:8px; }
    canvas { background:#2b3243; border-radius:12px; max-height: 86vh; }
    .grid2 { display:grid; grid-template-columns: 1fr 1fr; gap:8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <h2>最小テロップ合成</h2>
      <div class="grid2">
        <button id="pickVideo">背景動画</button>
        <button id="pickBgm">BGM(任意)</button>
      </div>
      <div class="grid2">
        <input id="topText" placeholder="上テロップ" value="上テスト" />
        <input id="bottomText" placeholder="下テロップ" value="下テスト" />
      </div>
      <div class="grid2">
        <input id="fontColor" type="color" value="#ffffff" />
        <input id="boxColor" type="color" value="#303030" />
      </div>
      <div class="grid2">
        <input id="boxAlpha" type="number" min="0" max="1" step="0.05" value="0.8" />
        <input id="padding" type="number" step="1" value="16" />
      </div>
      <div class="grid2">
        <input id="offsetTop" type="number" value="80" />
        <input id="offsetBottom" type="number" value="-80" />
      </div>
      <div class="grid2">
        <button id="pickFont">フォント</button>
        <input id="outName" value="output_telop.mp4" />
      </div>
      <button id="exportBtn">FFmpegで書き出し</button>
      <pre id="log" style="white-space:pre-wrap;background:#111827;padding:10px;border-radius:8px;max-height:220px;overflow:auto;"></pre>
    </div>
    <div class="preview">
      <div>
        <video id="video" controls style="display:none"></video>
        <canvas id="canvas" width="540" height="960"></canvas>
      </div>
    </div>
  </div>
  <script type="module" src="./renderer.js"></script>
</body>
</html>
